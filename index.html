<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foll Bet - Originals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://firestore.googleapis.com">
    <link rel="dns-prefetch" href="https://www.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Space+Grotesk:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background-color: #050507;
        font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
        overflow-x: hidden;
      }
      #root {
        display: flex;
        flex-direction: column;
        min-height: 100dvh;
        justify-content: center;
        align-items: center;
      }
      .bg-ambient {
        position: fixed;
        inset: 0;
        background: 
          radial-gradient(circle at 50% 0%, rgba(57, 255, 20, 0.05) 0%, transparent 70%),
          radial-gradient(circle at 0% 100%, rgba(0, 243, 255, 0.05) 0%, transparent 70%);
        z-index: -1;
      }
      .initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .loader-visual {
        position: relative;
        width: 80px;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .outer-ring {
        position: absolute;
        width: 100%;
        height: 100%;
        border: 2px solid rgba(57, 255, 20, 0.05);
        border-top-color: #39FF14;
        border-radius: 50%;
        animation: spin 0.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        box-shadow: 0 0 25px rgba(57, 255, 20, 0.2);
      }
      .inner-box {
        width: 32px;
        height: 32px;
        background: #39FF14;
        border-radius: 6px;
        transform: rotate(45deg);
        animation: pulseAndRotate 1.5s ease-in-out infinite;
        box-shadow: 0 0 20px rgba(57, 255, 20, 0.4);
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulseAndRotate {
        0%, 100% { transform: scale(1) rotate(45deg); }
        50% { transform: scale(0.8) rotate(225deg); opacity: 0.8; }
      }
      .logo-text {
        color: #fff;
        font-weight: 900;
        letter-spacing: -2px;
        font-size: 36px;
        font-style: italic;
        text-shadow: 0 0 30px rgba(57, 255, 20, 0.2);
      }
      .logo-dot {
        color: #39FF14;
        animation: blink 0.8s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      .loading-track {
        width: 160px;
        height: 2px;
        background: rgba(255,255,255,0.05);
        border-radius: 10px;
        overflow: hidden;
        margin-top: 15px;
      }
      .loading-fill {
        height: 100%;
        width: 40%;
        background: #39FF14;
        box-shadow: 0 0 10px #39FF14;
        animation: moveFill 1.5s ease-in-out infinite;
      }
      @keyframes moveFill {
        0% { transform: translateX(-150%); }
        100% { transform: translateX(350%); }
      }
      .sync-text {
        margin-top: 10px;
        font-size: 10px;
        color: rgba(255,255,255,0.2);
        text-transform: uppercase;
        letter-spacing: 0.4em;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <div class="bg-ambient"></div>
    <div id="root">
      <div class="initial-loader">
        <div class="loader-visual">
          <div class="outer-ring"></div>
          <div class="inner-box"></div>
        </div>
        <div style="display: flex; flex-direction: column; align-items: center;">
          <div class="logo-text">FOLL<span class="logo-dot">.</span>BET</div>
          <div class="loading-track">
            <div class="loading-fill"></div>
          </div>
          <div class="sync-text">Sincronizando Sistema</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
